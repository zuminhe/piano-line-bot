name: Member access tests
on:
  push:
    branches:
      - feature/member-access-hardening-20261020
      - feature/admin-menu-feedback-20261020
      - feature/single-user-test-menu-20261020
      - feature/menu-restore-snapshot-20261020
      - feature/menu-backup-restore-api-20261020
      - feature/menu-backup-readonly-integration-20261021
      - feature/menu-switch-restore-simulation-20261021
      - feature/menu-line-adapter-recovery-20261021
      - feature/menu-durable-lock-20261021
      - feature/menu-readonly-recovery-dashboard-20261021
      - feature/richmenu-artwork-validation-20261021
      - feature/detached-richmenu-provision-draft-20261021
      - feature/course-content-mvp-20261022
      - feature/official-catalog-responsive-sales-20261023
      - feature/typography-standard-20261023
      - feature/mux-payments-foundation-20261023
  pull_request:
    paths:
      - "lib/**"
      - "api/**"
      - "test/**"
      - ".github/workflows/member-access-tests.yml"
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test test/*.test.js
      - run: |
          node --check api/webhook.js
          node --check api/admin.js
          node --check api/portaly-webhook.js
          node --check lib/store.js
          node --check lib/line.js
          node --check lib/line-menu-read.js
          node --check lib/menu-switch-service.js
          node --check lib/line-menu-switch-adapter.js
          node --check lib/menu-recovery-inspector.js
          node --check lib/menu-backup-service.js
          node --check lib/detached-richmenu-provision.js
          node --check lib/line-login.js
          node --check lib/session.js
          node --check api/auth/line/start.js
          node --check api/auth/line/callback.js
          node --check api/auth/line/liff.js
          node --check api/auth/logout.js
          node --check api/student/me.js
          node --check api/student/config.js
          node --check lib/course-content.js
          node --check lib/course-store.js
          node --check lib/course-catalog.js
          node --check lib/mux-signed-playback.js
          node --check lib/checkout-pricing.js
          node --check api/course.js
          node --check lib/http/student-unit.js
          node --check lib/http/student-lesson.js
          node --check lib/http/student-progress.js
          node --check lib/http/student-playback.js
          node --check lib/http/checkout-quote.js
          node --check lib/http/checkout-draft.js
