name: Browser QA smoke tests

on:
  push:
    branches:
      - fix/qa-student-admin-races-20261024
  pull_request:
    paths:
      - "student.html"
      - "admin.html"
      - "test/browser-qa.mjs"
      - ".github/workflows/browser-qa.yml"

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node test/browser-qa.mjs
