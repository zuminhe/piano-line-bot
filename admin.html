<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>鋼琴課程｜權限管理</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#152b48;background:#f4f7fc}
*{box-sizing:border-box}body{margin:0}header{background:#132b53;color:white;padding:20px max(18px,calc((100vw - 980px)/2))}
main{max-width:980px;margin:auto;padding:18px}section{background:white;padding:20px;border-radius:14px;margin:16px 0;border:1px solid #e1e8f4}
h1{font-size:22px;margin:0}h2{font-size:19px;margin:0 0 14px}label{display:block;font-size:14px;margin:12px 0 5px}
input,select,button{font:inherit;padding:11px;border-radius:8px}input,select{border:1px solid #c2cad6;width:100%;max-width:500px}
button{border:0;color:white;background:#12345f;cursor:pointer;margin:8px 8px 8px 0}button.secondary{background:#63748b}
small,.hint{color:#687c90}.error{color:#aa2131}.ok{color:#196b4a}#app{display:none}
.row{display:flex;flex-wrap:wrap;gap:12px}.row>*{flex:1;min-width:190px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf2fa;padding:16px;border-radius:8px}
.card{border:1px solid #e4e8ee;border-radius:8px;padding:12px;margin:8px 0}
</style>
</head>
<body>
<header><h1>🎹 終極和弦伴奏公式｜後台管理</h1></header>
<main>
<section id="login"><h2>管理員登入</h2><label for="secret">管理員密鑰</label><input id="secret" type="password" autocomplete="off"><p class="hint">僅在本次分頁暫存密鑰，關閉或重新整理即消失。請勿在他人電腦登入。</p><button id="loginButton">確認登入</button></section>
<div id="app">
<section><h2>手動發送購課驗證碼</h2><p class="hint">付款自動串接尚未啟用。請先到 Portaly 確認款項後，再發碼。</p>
<label for="plan">購買權益</label><select id="plan"></select>
<div class="row"><div><label for="order">訂單編號</label><input id="order"></div><div><label for="note">備註</label><input id="note"></div></div>
<label for="expiry">到期日（僅訂閱必填）</label><input type="date" id="expiry">
<button id="issue">核對付款後，建立驗證碼</button><pre id="voucher">尚未產生</pre>
</section>
<section><h2>學員個別權限管理</h2>
<label for="userId">LINE userId（以 U 開頭）</label><input id="userId" placeholder="Uxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
<div><button id="lookup">查詢學員</button><button id="grant">人工補開所選方案</button><button id="sync" class="secondary">重新同步圖文選單</button></div>
<p class="hint">人工補開需要正確的 LINE userId；學員可以先輸入驗證碼自動綁定。</p><div id="member"></div>
</section>
<section><h2>最近產生的驗證紀錄</h2><button id="refresh" class="secondary">重新整理</button><div id="history"></div></section>
</div>
<p id="status" aria-live="polite"></p>
</main>
<script>
let secret='';
const $=id=>document.getElementById(id);
const status=(s,isError=false)=>{const x=$('status');x.textContent=s;x.className=isError?'error':'ok'};
async function api(method,params,body) {
  const url='/api/admin'+(params?'?'+new URLSearchParams(params):'');
  const result=await fetch(url,{method,headers:{Authorization:'Bearer '+secret,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});
  const data=await result.json().catch(()=>({}));
  if(!result.ok)throw Error(data.error||'HTTP '+result.status);
  return data;
}
function element(tag,text,parent) {const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);parent.appendChild(e);return e}
async function run(fn){try{await fn();status('操作完成')}catch(e){status(e.message,true)}}
$('loginButton').onclick=()=>run(async()=>{
 secret=$('secret').value;$('secret').value='';
 const data=await api('GET');
 $('plan').replaceChildren();Object.entries(data.plans).forEach(([code,plan])=>{const o=element('option',plan.label,$('plan'));o.value=code});
 $('login').style.display='none';$('app').style.display='block';await loadHistory();
});
function inputs() {
 const val=$('expiry').value;
 return {plan:$('plan').value,orderId:$('order').value||null,note:$('note').value,
    expiresAt:val?new Date(val+'T23:59:59+08:00').toISOString():null};
}
function userId(){return $('userId').value.trim()}
$('issue').onclick=()=>run(async()=>{
 if(!confirm('你已在 Portaly 核對完成付款，確定建立一次性驗證碼？'))return;
 const obj=await api('POST',null,{action:'issue_code',...inputs()});
 $('voucher').textContent='驗證碼（只顯示本次）：'+obj.code+'\n有效至：'+obj.expiresAt+'\n請私下交給學員，切勿公開。';
 await loadHistory();
});
async function loadMember(){
 const data=await api('GET',{action:'member',userId:userId()});
 const target=$('member');target.replaceChildren();
 element('p','有效權限：單元 '+(data.access.units.join('、')||'無')+'；陪練：'+(data.access.coaching?'有效':'無'),target);
 for(const g of data.grants){
   const card=element('div',undefined,target);card.className='card';
   element('strong',g.label+' ｜'+g.status,card);
   element('p','權益編號：'+g.id+'；到期：'+(g.expiresAt||'依課程規定'),card);
   if(g.status!=='revoked'){
    const btn=element('button','撤銷這筆權限',card);btn.className='secondary';
    btn.onclick=()=>run(async()=>{
     if(!confirm('確定撤銷該學員的這筆權限？'))return;
     await api('POST',null,{action:'revoke',userId:userId(),grantId:g.id});await loadMember();
    });
   }
 }
}
$('lookup').onclick=()=>run(loadMember);
$('grant').onclick=()=>run(async()=>{
 if(!confirm('確認人工開通該學員的「'+$('plan').selectedOptions[0].textContent+'」權益？'))return;
 await api('POST',null,{action:'grant',userId:userId(),...inputs()});await loadMember();
});
$('sync').onclick=()=>run(async()=>{const d=await api('POST',null,{action:'sync_menu',userId:userId()});status('選單同步：'+d.menuSync.status)});
async function loadHistory(){
 const data=await api('GET',{action:'vouchers'});
 const div=$('history');div.replaceChildren();
 for(const c of data.codes){const card=element('div',undefined,div);card.className='card';element('p',c.plan+' ｜訂單 '+(c.orderId||'人工核對')+' ｜'+c.issuedAt,card)}
}
$('refresh').onclick=()=>run(loadHistory);
</script>
</body></html>
